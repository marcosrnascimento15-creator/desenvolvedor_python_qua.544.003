<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>P o l t e g i t | Automatizador </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fontes.css') }}">
  </head>
  <body class="bg-dark" data-bs-theme="dark">
    <main class="container vh-100 d-flex align-items-center justify-content-center">
        <section class="row">
            <figure class="d-flex justify-content-center mb-3">
                <img src="{{ url_for('static', filename='img/ghost01.png') }}" alt="fantasma_logo" class="img-fluid" width="200" height="200">
            </figure>
            <div class="d-flex justify-content-center mb-3">
                <h1>P O L T E R G I T</h1>
            </div><br>
            <form action="/comitar" method="POST">
                <div class="col-12">
                    <input type="text" placeholder="Informe o diretorio do repositório" class="form-control" name="repositorio" required>
                </div>
                <div class="d-flex justify-content-center mt-5">
                    <button type="submit" class="btn btn-success col-5">
                        <b>Comitar e Fazer Push</b>
                    </button>
                </div>
            </form>
        </section>
     </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
